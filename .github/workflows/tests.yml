name: tests

# Тесты сервера на настоящем PostgreSQL (Testcontainers), тесты бота и сборка сайта, CRM и кабинета владельца.
# Запускается на любой ветке: так работу можно проверить до слияния в main, откуда идёт выкладка.
on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
        working-directory: backend

  # Тесты бота идут без сети и без токена: Telegram и API в них подставные (bot/tests/conftest.py).
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider
        working-directory: bot

  sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: web
      - run: npm ci && npm run build
        working-directory: crm
      - run: npm ci && npm run build
        working-directory: owner
