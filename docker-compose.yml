services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ostatok
      POSTGRES_USER: ostatok
      POSTGRES_PASSWORD: ostatok
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ostatok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
