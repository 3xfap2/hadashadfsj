<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#15181a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Остаток" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Остаток — сроки годности и стоп-лист</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Открыто как мини-приложение Telegram: развернуть на весь экран. В обычном браузере ничего не загружается.
      if (location.hash.includes('tgWebAppData')) {
        const s = document.createElement('script');
        s.src = 'https://telegram.org/js/telegram-web-app.js';
        s.onload = () => { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); };
        document.head.appendChild(s);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
